<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Softwaresfast Institute student enrollment details form.">
  <title>Student Enrollment | Softwaresfast Institute</title>
  <style>
    :root {
      --primary: #1a5c3a;
      --primary-dark: #0f3d26;
      --gold: #d4af37;
      --ink: #14231b;
      --muted: #64748b;
      --surface: #ffffff;
      --canvas: #f3f7f4;
      --border: #dce8df;
      --success: #167544;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #edf6ef 0%, #f8f5eb 100%);
    }
    a { color: inherit; }

    .site-header {
      padding: 1rem 0;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .header-inner, .page { width: min(900px, calc(100% - 2rem)); margin: 0 auto; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand { text-decoration: none; font-weight: 800; letter-spacing: .06em; color: var(--primary); }
    .header-links { display: flex; gap: .55rem; flex-wrap: wrap; justify-content: flex-end; }
    .back-link { color: var(--primary); font-weight: 700; text-decoration: none; border: 1px solid #c6dccb; border-radius: 999px; padding: .45rem .8rem; }
    .back-link:hover { text-decoration: underline; }

    .page { padding: 3rem 0; }
    .intro { text-align: center; max-width: 700px; margin: 0 auto 2rem; }
    .eyebrow { color: var(--primary); font-weight: 800; letter-spacing: .1em; font-size: .75rem; text-transform: uppercase; }
    h1 { margin: .45rem 0 .7rem; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
    .intro p { margin: 0; color: var(--muted); }

    .progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin: 0 auto 2rem; max-width: 760px; }
    .progress-step { background: rgba(255,255,255,.7); color: var(--muted); padding: .8rem; border: 1px solid var(--border); border-radius: 10px; text-align: center; font-size: .9rem; font-weight: 700; }
    .progress-step.active { color: #fff; background: var(--primary); border-color: var(--primary); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: clamp(1.25rem, 3vw, 2rem); box-shadow: 0 10px 30px rgba(15, 61, 38, .08); }
    .card h2 { margin: 0 0 .35rem; font-size: 1.35rem; }
    .card-description { margin: 0 0 1.5rem; color: var(--muted); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .45rem; font-size: .9rem; font-weight: 700; }
    input, select {
      width: 100%; padding: .8rem .9rem; border: 1px solid #cbd8cf; border-radius: 9px;
      font: inherit; color: var(--ink); background: #fff;
    }
    input:focus, select:focus { outline: 3px solid rgba(26,92,58,.15); border-color: var(--primary); }
    .checkbox-row { display: flex; align-items: flex-start; gap: .65rem; color: #46564c; font-size: .9rem; line-height: 1.45; }
    .checkbox-row input { width: auto; margin-top: .25rem; accent-color: var(--primary); }

    .submit { width: 100%; margin-top: .5rem; border: 0; border-radius: 9px; padding: .82rem 1rem; font: inherit; font-weight: 800; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 5px 14px rgba(15, 61, 38, .22); }
    .status { min-height: 1.35rem; margin-top: .9rem; font-size: .88rem; color: var(--muted); }
    .status.error { color: var(--danger); font-weight: 700; }

    @media (max-width: 760px) {
      .page { padding: 2rem 0; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .progress-step { font-size: .78rem; padding: .65rem .35rem; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      .header-links { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">SOFTWARESFAST INSTITUTE</a>
      <div class="header-links">
        <a class="back-link" href="institute.html">Institute</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">Institute portal</div>
      <h1 id="page-title">Student Enrollment</h1>
      <p>Complete your student profile, then continue to the standalone Face ID setup page.</p>
    </section>

    <div class="progress" aria-label="Enrollment progress">
      <div class="progress-step active">1. Student details</div>
      <div class="progress-step">2. Face ID setup</div>
      <div class="progress-step">3. Document verification</div>
    </div>

    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Student details</h2>
      <p class="card-description">Use the information that will appear on your institute record.</p>
      <form id="enrollmentForm" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="firstName">First name</label>
            <input id="firstName" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input id="lastName" name="lastName" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="field">
            <label for="program">Program</label>
            <select id="program" name="program" required>
              <option value="">Select a program</option>
              <option>Web Development</option>
              <option>Mobile App Development</option>
              <option>UI/UX Design</option>
              <option>Cloud & DevOps</option>
              <option>Quality Assurance</option>
            </select>
          </div>
        </div>
        <label class="checkbox-row" for="consent">
          <input id="consent" name="consent" type="checkbox" required>
          <span>I consent to the use of my enrollment photo for institute identity verification and attendance check-in.</span>
        </label>
        <button class="submit" type="submit">Continue to Face ID setup</button>
      </form>
      <p id="formStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('enrollmentForm');
    const formStatus = document.getElementById('formStatus');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      formStatus.className = 'status';
      formStatus.textContent = '';

      if (!form.checkValidity()) {
        form.reportValidity();
        formStatus.className = 'status error';
        formStatus.textContent = 'Please complete all required enrollment details.';
        return;
      }

      sessionStorage.setItem('enrollmentComplete', 'true');
      sessionStorage.removeItem('faceIdComplete');
      sessionStorage.removeItem('documentVerificationComplete');
      const firstName = encodeURIComponent(document.getElementById('firstName').value.trim());
      window.location.href = `face-id-setup.html?firstName=${firstName}`;
    });
  </script>
</body>
</html>
